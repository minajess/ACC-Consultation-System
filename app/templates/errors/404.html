{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-signpost-split display-1 text-warning"></i>
  <h2 class="mt-3">404 — Page Not Found</h2>
  <p class="text-muted">The page you're looking for doesn't exist.</p>
  <a href="{{ url_for('index') }}" class="btn btn-success mt-2">Go to Dashboard</a>
</div>
{% endblock %}
