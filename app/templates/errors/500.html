{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
  <h2 class="mt-3">500 — Something Went Wrong</h2>
  <p class="text-muted">An unexpected error occurred. Please try again, or contact the system administrator if this continues.</p>
  <a href="{{ url_for('index') }}" class="btn btn-success mt-2">Go to Dashboard</a>
</div>
{% endblock %}
